name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_builder.py -v
      - run: python -m unittest discover -s tests -p test_explorer.py -v
      - run: python -m unittest discover -s tests -p test_recommendation.py -v
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=tests python tests/browser_smoke.py
